<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="chatbotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#chatbotGradient)"/>
  <rect x="30" y="30" width="340" height="240" fill="rgba(255,255,255,0.1)" rx="10"/>
  <ellipse cx="80" cy="90" rx="50" ry="30" fill="url(#bubbleGradient)"/>
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white" font-weight="bold">🤖</text>
  <rect x="50" y="130" width="140" height="50" fill="rgba(255,255,255,0.2)" rx="8"/>
  <text x="65" y="150" font-family="Arial, sans-serif" font-size="12" fill="white">Hello! How can</text>
  <text x="65" y="165" font-family="Arial, sans-serif" font-size="12" fill="white">I help you today?</text>
  <ellipse cx="320" cy="90" rx="50" ry="30" fill="rgba(255,255,255,0.3)"/>
  <text x="320" y="100" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">👤</text>
  <rect x="210" y="210" width="140" height="50" fill="rgba(255,255,255,0.3)" rx="8"/>
  <text x="225" y="230" font-family="Arial, sans-serif" font-size="12" fill="white">I need information</text>
  <text x="225" y="245" font-family="Arial, sans-serif" font-size="12" fill="white">about your cars</text>
</svg>