<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sentimentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="positiveGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sentimentGradient)"/>
  <rect x="30" y="30" width="340" height="240" fill="rgba(255,255,255,0.1)" rx="10"/>
  <rect x="50" y="60" width="300" height="40" fill="rgba(255,255,255,0.15)" rx="8"/>
  <rect x="50" y="60" width="210" height="40" fill="url(#positiveGradient)" rx="8"/>
  <circle cx="70" cy="150" r="25" fill="rgba(76,175,80,0.8)"/>
  <text x="70" y="158" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white">😊</text>
  <circle cx="160" cy="150" r="25" fill="rgba(255,193,7,0.8)"/>
  <text x="160" y="158" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white">😐</text>
  <circle cx="250" cy="150" r="25" fill="rgba(244,67,54,0.8)"/>
  <text x="250" y="158" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="white">😞</text>
  <text x="70" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Positive: 75%</text>
  <text x="250" y="215" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white" font-weight="bold">Negative: 15%</text>
  <text x="100" y="250" font-family="Arial, sans-serif" font-size="12" fill="white">★★★★★</text>
</svg>